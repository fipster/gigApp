<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gigApp - MY favorite bands on tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>

<body>
  <div class="wrap">

    <header class="bill">
      <div class="bill-text">
        <p class="eyebrow">One App to Rule Them All</p>
        <h1 id="resetTitle">MY Bands<br><span>Are Out There</span></h1>
        <p class="sub">

        </p>
        <div class="origin">
          <div>ORIGINS: <b>TLL · RIX</b></div>
          <div>SHOWS: <b id="totalCount">–</b></div>
          <div>WINDOW: <b id="windowLabel">–</b></div>
        </div>
      </div>
      <img class="bill-photo" src="IMG_20260627_191410.jpg" alt="">
    </header>

    <div class="controls">
      <div class="row">
        <span class="label">BANDS</span>
        <details class="city-filter" id="bandFilterDetails">
          <summary><span class="filter-count" id="bandFilterCount"></span> ▾</summary>
          <div class="city-filter-panel">
            <input type="text" class="filter-search" id="bandSearchInput" placeholder="search bands…">
            <div class="row mode-row">
              <div class="chip acid active" data-bandmode="include">SHOW SELECTED</div>
              <div class="chip acid" data-bandmode="exclude">HIDE SELECTED</div>
              <button class="reset-link" id="selectAllBands">select all</button>
              <button class="reset-link" id="selectNoneBands">select none</button>
            </div>
            <div id="bandCheckboxList"></div>
          </div>
        </details>
        <div class="chip acid" data-filter="priority" data-value="I" title="only priority I bands">I</div>
        <div class="chip acid" data-filter="priority" data-value="II" title="only priority II bands">II</div>
        <div class="chip acid" data-filter="priority" data-value="est" title="only priority est bands">est</div>
        <div class="spacer"></div>
        <label class="toggle">exclude festivals <input type="checkbox" id="excludeFest"></label>
      </div>
      <div class="row">
        <span class="label">FLY FROM</span>
        <div class="chip acid" data-filter="origin" data-value="TLL">TLL</div>
        <div class="chip acid" data-filter="origin" data-value="RIX">RIX</div>
      </div>
      <div class="row">
        <span class="label">SOURCES</span>
        <details class="city-filter" id="sourceFilterDetails">
          <summary><span class="filter-count" id="sourceFilterCount"></span> ▾</summary>
          <div class="city-filter-panel">
            <input type="text" class="filter-search" id="sourceSearchInput" placeholder="search sources…">
            <div class="row mode-row">
              <div class="chip acid active" data-sourcemode="include">SHOW SELECTED</div>
              <div class="chip acid" data-sourcemode="exclude">HIDE SELECTED</div>
              <button class="reset-link" id="selectAllSources">select all</button>
              <button class="reset-link" id="selectNoneSources">select none</button>
            </div>
            <div id="sourceCheckboxList"></div>
          </div>
        </details>
        <div class="spacer"></div>
      </div>
      <div class="row">
        <span class="label">CITIES</span>
        <details class="city-filter" id="cityFilterDetails">
          <summary><span class="filter-count" id="cityFilterCount"></span> ▾</summary>
          <div class="city-filter-panel">
            <input type="text" class="filter-search" id="citySearchInput" placeholder="search cities…">
            <div class="row mode-row">
              <div class="chip acid active" data-mode="include">SHOW SELECTED</div>
              <div class="chip acid" data-mode="exclude">HIDE SELECTED</div>
              <button class="reset-link" id="selectAllCities">select all</button>
              <button class="reset-link" id="selectNoneCities">select none</button>
            </div>
            <div id="cityCheckboxList"></div>
          </div>
        </details>
        <div class="spacer"></div>
      </div>
      <div class="row">
        <span class="label">DATES</span>
        <select id="datePreset">
          <option value="all">All (no filter)</option>
          <option value="vaheaeg1">I</option>
          <option value="vaheaeg2">II</option>
          <option value="vaheaeg3">III</option>
          <option value="vaheaeg4">IV</option>
          <option value="vaheaeg5">V</option>
          <option value="custom">Custom range…</option>
        </select>
        <div class="date-range" id="customDateRange" hidden>
          <input type="date" id="dateFrom">
          <span>→</span>
          <input type="date" id="dateTo">
        </div>
        <div class="spacer"></div>
        <span class="label">SORT BY</span>
        <select id="sortBy">
          <option value="date">Date</option>
          <option value="bandCount">Bands per event</option>
        </select>
      </div>
    </div>

    <div class="view-switch">
      <button class="view-btn active" data-view="list">LIST</button>
      <button class="view-btn" data-view="weekly">WEEKLY</button>
      <button class="view-btn" data-view="map">MAP</button>
    </div>

    <div class="route" id="route"></div>

    <div class="weekly-view" id="weeklyView" hidden>
      <div class="week-nav">
        <button class="reset-link" id="weekPrev">← prev week</button>
        <span class="week-label" id="weekLabel"></span>
        <button class="reset-link" id="weekNext">next week →</button>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <div class="map-view" id="mapViewContainer" hidden>
      <div id="mapView"></div>
    </div>

    <footer>
      copyright © 2015. hand-vibed by me
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>

</body>

</html>
